{% extends "base.html" %}
{% block title %}Request a Skill - SkillSwap{% endblock %}
{% block content %}
<section class="form-page">
    <div class="form-card wide">
        <h2>Request a Skill</h2>
        <form method="POST" action="{{ url_for('request_skill') }}">
            <label>Skill Needed</label>
            <input type="text" name="skill_name" required placeholder="e.g. Python Programming">

            <label>Category</label>
            <input type="text" name="category" placeholder="e.g. Programming">

            <div class="form-row">
                <div>
                    <label>Preferred Duration (hours)</label>
                    <input type="number" name="duration" min="1" max="8" step="0.5" value="1" required>
                </div>
                <div>
                    <label>Mode</label>
                    <select name="mode">
                        <option value="Online">Online</option>
                        <option value="Offline">Offline</option>
                        <option value="Both">Both</option>
                    </select>
                </div>
            </div>

            <label>Location</label>
            <input type="text" name="location" placeholder="e.g. Salem, Tamil Nadu">

            <label>Available Days</label>
            <div class="checkbox-row">
                {% for day in ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"] %}
                <label class="checkbox-pill">
                    <input type="checkbox" name="available_days" value="{{ day }}"> {{ day }}
                </label>
                {% endfor %}
            </div>

            <label>Available Time</label>
            <input type="text" name="available_time" placeholder="e.g. Weekend mornings">

            <button type="submit" class="btn btn-primary full-width">Find Matches</button>
        </form>
    </div>
</section>
{% endblock %}
